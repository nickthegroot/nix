name: Update flake inputs

on:
  schedule:
    - cron: "0 16 * * 6"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install nix
        uses: cachix/install-nix-action@v31

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update flake inputs
        id: update
        run: |
          before="$(git rev-parse HEAD)"
          nix flake update --commit-lock-file
          if [ "$before" = "$(git rev-parse HEAD)" ] && [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check flake
        if: steps.update.outputs.changed == 'true'
        run: nix flake check

      - name: Push update branch
        if: steps.update.outputs.changed == 'true'
        run: git push --force origin HEAD:refs/heads/flake-update

      - name: Start flake check
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run test.yml --ref flake-update

      - name: Open pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state="$(gh pr view flake-update --json state --jq .state 2>/dev/null || true)"
          if [ "$state" = "OPEN" ]; then
            gh pr edit flake-update --title "flake.lock: Update"
          else
            gh pr create --base main --head flake-update \
              --title "flake.lock: Update" \
              --body "Automated flake input update from \`.github/workflows/flake-update.yml\`."
          fi

      - name: Enable auto-merge
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash flake-update

      - name: Report updated inputs
        if: steps.update.outputs.changed == 'true'
        run: git show --stat --format='%s' HEAD
